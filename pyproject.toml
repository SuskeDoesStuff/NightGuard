[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nightguard"
version = "0.1.0"
description = "A partially-observable RL environment for asymmetric surveillance-and-resource management."
readme = "README.md"
# 3.12 floor: numpy's type stubs use `type` statements that only parse under 3.12, so
# `mypy --strict` cannot actually be run at 3.11. See PROJECT.md 1.2.
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.0",
    "stable-baselines3>=2.0",
    "sb3-contrib>=2.0",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nightguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
# Deliberately not pinning python_version: recent numpy stubs use `type` statements that only parse
# under 3.12+, so pinning to the 3.11 floor makes mypy fail inside numpy before reaching our code.
# The runtime floor stays 3.11 via requires-python.
strict = true
